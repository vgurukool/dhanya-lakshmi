replicaCount: 1

image:
  repository: ayusing/dhanya-lakshmi
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3003
  targetPort: 3003

persistence:
  enabled: false
  storageClass: "gp3"
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /app/data

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: dhanya-lakshmi.vgurukool.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: dhanya-lakshmi-tls
      hosts:
        - dhanya-lakshmi.vgurukool.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env:
  ENVIRONMENT: "production"
  PORT: "3003"

nodeSelector: {}
tolerations: []
affinity: {}
